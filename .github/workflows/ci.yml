name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore and audit packages
        run: >
          dotnet restore MinioFileManagement.sln
          --force-evaluate
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror

      - name: Build solution
        run: >
          dotnet build MinioFileManagement.sln
          --configuration Release
          --no-restore

      - name: Run unit tests
        run: >
          dotnet test MinioFileManagement.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

      - name: Report vulnerable NuGet packages
        run: >
          dotnet package list
          --project MinioFileManagement.sln
          --include-transitive
          --vulnerable
          --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FileManagement.Web/package-lock.json

      - name: Install dependencies
        working-directory: src/FileManagement.Web
        run: npm ci

      - name: Run lint
        working-directory: src/FileManagement.Web
        run: npm run lint

      - name: Run frontend tests
        working-directory: src/FileManagement.Web
        run: npm test

      - name: Build frontend
        working-directory: src/FileManagement.Web
        run: npm run build

      - name: Audit npm packages
        working-directory: src/FileManagement.Web
        run: npm audit --audit-level=high

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate Compose configuration
        run: >
          docker compose
          --env-file .env.example
          config
          --quiet

      - name: Verify Compose service inventory
        run: |
          services="$(
            docker compose \
              --env-file .env.example \
              config \
              --services
          )"
          printf '%s\n' "$services"

          service_count="$(printf '%s\n' "$services" | wc -l)"
          test "$service_count" -eq 15

      - name: Build application images
        run: >
          docker compose
          --env-file .env.example
          build
          minio
          api
          identity-api
          gateway
          operations-worker
          outbox-worker
          reporting-worker
          web

      - name: Inspect application images
        run: |
          docker image inspect minio-file-management/api:local
          docker image inspect minio-file-management/identity-api:local
          docker image inspect minio-file-management/gateway:local
          docker image inspect minio-file-management/operations-worker:local
          docker image inspect minio-file-management/outbox-worker:local
          docker image inspect minio-file-management/reporting-worker:local
          docker image inspect minio-file-management/web:local
          minio_version="$(
            grep '^MINIO_VERSION=' .env.example |
              cut -d= -f2-
          )"
          test -n "$minio_version"
          docker image inspect \
            "minio-file-management/minio:${minio_version}"
